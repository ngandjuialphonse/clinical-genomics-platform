version: '3.8'

services:
  db:
    image: postgres:13-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=clinical_genomics
    ports:
      - "5432:5432"

  api:
    build: ./api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./api:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/clinical_genomics

  dashboard:
    build: ./dashboard
    command: streamlit run app.py
    volumes:
      - ./dashboard:/app
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  postgres_data:
